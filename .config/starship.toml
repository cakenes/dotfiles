format = '''$git_status$git_branch$directory$rust$package$character'''
"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"
add_newline = false

[character]
success_symbol = '[❯](blue) '
error_symbol = '[✖](red) '

[directory]
style = 'bold blue'
read_only = ' 🔒'
read_only_style = 'red'

[package]
disabled = true

[nodejs]
disabled = true

[cmd_duration]
disabled = true

[git_branch]
format = '[$branch(:$remote_branch)]($style) '
style = 'dimmed blue'

[git_status]
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
style = 'dimmed blue'

